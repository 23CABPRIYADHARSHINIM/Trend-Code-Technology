<!DOCTYPE html>
<html>
<body>
  <img id="img" src="file:///C:/Users/ELCOT/Desktop/TCT-main/TCT-main/public/images/Logo.jpeg" style="display:none;" />
  <canvas id="canvas"></canvas>
  <div id="output"></div>
  <script>
    const img = document.getElementById('img');
    img.onload = function() {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;
      
      const colors = {};
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i], g = data[i+1], b = data[i+2];
        const hex = '#' + ((1<<24) + (r<<16) + (g<<8) + b).toString(16).slice(1);
        if (colors[hex]) colors[hex]++;
        else colors[hex] = 1;
      }
      
      // We want to find the most dominant blue and most dominant orange
      let bestBlue = null;
      let maxBlueCount = 0;
      let bestOrange = null;
      let maxOrangeCount = 0;
      
      for (let hex in colors) {
        const r = parseInt(hex.substring(1,3), 16);
        const g = parseInt(hex.substring(3,5), 16);
        const b = parseInt(hex.substring(5,7), 16);
        
        // Basic blue detection
        if (b > r + 30 && b > g + 30 && b > 80) {
          if (colors[hex] > maxBlueCount) {
            maxBlueCount = colors[hex];
            bestBlue = hex;
          }
        }
        
        // Basic orange detection
        if (r > g + 20 && r > b + 50 && g > 50 && r > 100) {
          if (colors[hex] > maxOrangeCount) {
            maxOrangeCount = colors[hex];
            bestOrange = hex;
          }
        }
      }
      
      document.getElementById('output').innerText = 'Blue: ' + bestBlue + ' | Orange: ' + bestOrange;
    };
  </script>
</body>
</html>
